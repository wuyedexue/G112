<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频下载工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 28px;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        .input-group input:focus {
            border-color: #0f3460;
            box-shadow: 0 0 0 3px rgba(15, 52, 96, 0.1);
        }

        .input-group input::placeholder {
            color: #aaa;
        }

        .btn-download {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0f3460, #1a1a2e);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(15, 52, 96, 0.3);
        }

        .btn-download:active {
            transform: translateY(0);
        }

        .btn-download:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status {
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            line-height: 1.5;
        }

        .status.info {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #90caf9;
            display: block;
        }

        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
            display: block;
        }

        .status.error {
            background: #fce4ec;
            color: #c62828;
            border: 1px solid #ef9a9a;
            display: block;
        }

        .progress-bar {
            margin-top: 16px;
            display: none;
        }

        .progress-bar.active {
            display: block;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0f3460, #1a1a2e);
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s;
        }

        .progress-text {
            text-align: center;
            margin-top: 8px;
            font-size: 13px;
            color: #666;
        }

        .tips {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .tips h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 10px;
        }

        .tips ul {
            list-style: none;
            padding: 0;
        }

        .tips ul li {
            font-size: 13px;
            color: #666;
            padding: 4px 0;
            padding-left: 20px;
            position: relative;
        }

        .tips ul li::before {
            content: "\2022";
            position: absolute;
            left: 6px;
            color: #0f3460;
        }

        .history {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .history h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history h3 button {
            font-size: 12px;
            color: #999;
            background: none;
            border: none;
            cursor: pointer;
        }

        .history h3 button:hover {
            color: #c62828;
        }

        .history-list {
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid #f5f5f5;
            font-size: 13px;
            color: #555;
            cursor: pointer;
        }

        .history-item:hover {
            color: #0f3460;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item .url-text {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-empty {
            font-size: 13px;
            color: #aaa;
            text-align: center;
            padding: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>视频下载工具</h1>
            <p>粘贴视频链接地址，一键下载视频文件到电脑</p>
        </div>

        <div class="input-group">
            <label for="videoUrl">视频链接地址</label>
            <input type="url" id="videoUrl" placeholder="粘贴视频链接，例如: https://example.com/video.mp4" 
                   onkeypress="if(event.key==='Enter')downloadVideo()">
        </div>

        <div class="input-group">
            <label for="fileName">保存文件名（可选，不填自动生成）</label>
            <input type="text" id="fileName" placeholder="例如: 我的视频.mp4">
        </div>

        <button class="btn-download" id="btnDownload" onclick="downloadVideo()">
            开始下载
        </button>

        <div class="progress-bar" id="progressBar">
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">准备下载...</div>
        </div>

        <div class="status" id="status"></div>

        <div class="history" id="historySection">
            <h3>
                <span>下载历史</span>
                <button onclick="clearHistory()">清空</button>
            </h3>
            <div id="historyList"></div>
        </div>

        <div class="tips">
            <h3>使用说明</h3>
            <ul>
                <li>将视频链接粘贴到上方输入框，点击"开始下载"即可</li>
                <li>支持 MP4、WebM、AVI、MKV、MOV 等常见视频格式</li>
                <li>适用于可以直接访问的视频文件链接（直链）</li>
                <li>如果下载的是网页而不是视频，说明链接不是视频直链</li>
                <li>本工具无需安装任何软件，打开网页即可使用</li>
                <li>下载的视频保存在浏览器默认的"下载"文件夹中</li>
            </ul>
        </div>
    </div>

    <script>
        // Load download history on page load
        document.addEventListener('DOMContentLoaded', loadHistory);

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.innerHTML = message;
            status.className = 'status ' + type;
        }

        function hideStatus() {
            document.getElementById('status').className = 'status';
        }

        function showProgress(show) {
            document.getElementById('progressBar').classList.toggle('active', show);
        }

        function updateProgress(percent, text) {
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = text;
        }

        function getFileName(url) {
            const customName = document.getElementById('fileName').value.trim();
            if (customName) {
                if (!/\.\w{2,4}$/.test(customName)) {
                    const urlExt = url.split('?')[0].split('.').pop();
                    const validExts = ['mp4', 'webm', 'avi', 'mkv', 'mov', 'flv', 'wmv'];
                    const ext = validExts.includes(urlExt) ? urlExt : 'mp4';
                    return customName + '.' + ext;
                }
                return customName;
            }
            try {
                const pathname = new URL(url).pathname;
                const name = pathname.split('/').pop();
                if (name && /\.\w{2,4}$/.test(name)) {
                    return decodeURIComponent(name);
                }
            } catch (e) {}
            return 'video_' + Date.now() + '.mp4';
        }

        async function downloadVideo() {
            const url = document.getElementById('videoUrl').value.trim();
            if (!url) {
                showStatus('请输入视频链接地址', 'error');
                return;
            }

            try {
                new URL(url);
            } catch (e) {
                showStatus('请输入有效的链接地址（以 http:// 或 https:// 开头）', 'error');
                return;
            }

            const btn = document.getElementById('btnDownload');
            btn.disabled = true;
            btn.textContent = '下载中...';
            hideStatus();

            const fileName = getFileName(url);

            // Try fetch first for progress display, fall back to direct link
            try {
                showProgress(true);
                updateProgress(0, '正在连接...');

                const response = await fetch(url, {
                    mode: 'cors',
                    redirect: 'follow'
                });

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }

                const contentLength = response.headers.get('content-length');
                const total = contentLength ? parseInt(contentLength) : 0;
                let loaded = 0;

                const reader = response.body.getReader();
                const chunks = [];

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    loaded += value.length;

                    if (total > 0) {
                        const percent = Math.round((loaded / total) * 100);
                        updateProgress(percent, '下载中: ' + formatSize(loaded) + ' / ' + formatSize(total) + ' (' + percent + '%)');
                    } else {
                        updateProgress(50, '下载中: ' + formatSize(loaded));
                    }
                }

                const blob = new Blob(chunks);
                triggerBlobDownload(blob, fileName);
                updateProgress(100, '下载完成!');
                showStatus('下载成功! 文件已保存为: ' + fileName + ' (' + formatSize(loaded) + ')', 'success');
                saveHistory(url, fileName);

            } catch (error) {
                // Fetch failed (likely CORS) - use fallback direct link method
                showProgress(false);
                console.log('Fetch failed, using direct link method:', error.message);
                directLinkDownload(url, fileName);
            }

            btn.disabled = false;
            btn.textContent = '开始下载';
        }

        function directLinkDownload(url, fileName) {
            // Method: create a temporary <a> element with download attribute
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            showStatus(
                '已触发下载! 请查看浏览器底部或"下载"文件夹。<br><br>' +
                '<small style="color:#666;">提示: 如果浏览器打开了视频而不是下载，请在视频上右键选择"另存为"来保存。</small>',
                'info'
            );
            saveHistory(url, fileName);
        }

        function triggerBlobDownload(blob, fileName) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
        }

        // Download history management using localStorage
        function saveHistory(url, fileName) {
            try {
                let history = JSON.parse(localStorage.getItem('videoDownloadHistory') || '[]');
                // Remove duplicate
                history = history.filter(item => item.url !== url);
                // Add to front
                history.unshift({ url: url, fileName: fileName, time: new Date().toLocaleString() });
                // Keep max 20 items
                if (history.length > 20) history = history.slice(0, 20);
                localStorage.setItem('videoDownloadHistory', JSON.stringify(history));
                loadHistory();
            } catch (e) {}
        }

        function loadHistory() {
            try {
                const history = JSON.parse(localStorage.getItem('videoDownloadHistory') || '[]');
                const container = document.getElementById('historyList');
                if (history.length === 0) {
                    container.innerHTML = '<div class="history-empty">暂无下载记录</div>';
                    return;
                }
                container.innerHTML = history.map(item =>
                    '<div class="history-item" onclick="reuseUrl(\'' + escapeHtml(item.url) + '\')">' +
                    '<span class="url-text" title="' + escapeHtml(item.url) + '">' + escapeHtml(item.url) + '</span>' +
                    '</div>'
                ).join('');
            } catch (e) {
                document.getElementById('historyList').innerHTML = '<div class="history-empty">暂无下载记录</div>';
            }
        }

        function clearHistory() {
            localStorage.removeItem('videoDownloadHistory');
            loadHistory();
        }

        function reuseUrl(url) {
            document.getElementById('videoUrl').value = url;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/'/g, '&#39;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
